name: Tests

# No path or base-branch filters: every PR must produce the required check.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Keep this name stable; select it in the branch ruleset's required checks.
    name: cellDIVER tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the proposed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free up runner disk space
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/.ghcup /usr/share/swift
          echo "Disk after cleanup:"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build reusable CI base image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ci-base
          load: true
          tags: celldiver-ci-base:ci
          provenance: false
          cache-from: type=gha,scope=celldiver-dockerfile
          cache-to: type=gha,mode=max,scope=celldiver-dockerfile

      - name: Verify Chrome
        run: docker run --rm celldiver-ci-base:ci google-chrome --version

      - name: Run all tests
        run: |
          set -euo pipefail
          mkdir -p test-results
          status=0
          docker run --rm \
            -e NOT_CRAN=true \
            -e CHROMOTE_CHROME=/usr/bin/google-chrome \
            -v "$PWD":/work \
            -w /work \
            celldiver-ci-base:ci \
            bash -s <<'EOF' || status=$?
          set -euo pipefail
          R CMD INSTALL -l "$R_LIBS_USER" .
          Rscript - <<'RS'
          .libPaths(c(Sys.getenv("R_LIBS_USER"), .libPaths()))
          dir.create("test-results", showWarnings = FALSE)
          results_directory <- normalizePath("test-results", mustWork = TRUE)
          testthat::set_max_fails(Inf)
          options(testthat.summary.max_reports = Inf)
          reporter <- testthat::MultiReporter$new(list(
            testthat::SummaryReporter$new(),
            testthat::JunitReporter$new(
              file = file.path(results_directory, "junit.xml")
            )
          ))
          results <- devtools::test(
            reporter = reporter,
            stop_on_failure = FALSE
          )
          results <- as.data.frame(results)
          summary <- c(
            "## cellDIVER test results",
            "",
            sprintf("Test blocks: %d", nrow(results)),
            sprintf("Passed expectations: %d", sum(results$passed)),
            sprintf("Failed expectations: %d", sum(results$failed)),
            sprintf("Errors: %d", sum(results$error)),
            sprintf("Skipped tests: %d", sum(results$skipped)),
            sprintf("Warnings: %d", sum(results$warning))
          )
          writeLines(summary, "test-results/summary.md")
          if (
            nrow(results) == 0L || sum(results$passed) == 0L ||
            any(results$failed > 0L | results$error | results$skipped)
          ) {
            stop("The complete test suite must pass without skips.")
          }
          RS
          EOF
          if [ -f test-results/summary.md ]; then
            cat test-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Build package
        run: |
          docker run --rm \
            -v "$PWD":/work \
            -w /work \
            celldiver-ci-base:ci \
            R CMD build . --no-build-vignettes --no-manual

      - name: Upload test reports and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            test-results/
            tests/testthat/_snaps/
            tests/testthat/apps/**/tests/
          if-no-files-found: warn
          retention-days: 14
