# ---------------------------------------------------------------------------
# Docker build-validation + GHCR publish workflow.
#
# WHAT THIS DOES
#   pull_request -> main : builds the repo's Dockerfile (the cellDIVER shiny-
#     server image) and smoke-tests the running container. PR runs NEVER push.
#   push -> main / v* tag : the same build + smoke test, then publishes the
#     validated image to ghcr.io/amc-heme/celldiver. Publishing happens ONLY
#     after the smoke test passes (see the push step near the bottom).
#
# IMPORTANT LIMITATION — do NOT read a green check as "my R code was tested"
#   The Dockerfile installs cellDIVER from amc-heme/cellDIVER on GitHub `main`,
#   NOT from this PR's checkout. So this gate validates the Dockerfile and the
#   dependency tree only; it does NOT exercise the R code changes in the PR
#   being built. That GitHub-main-vs-PR-checkout behavior is the intended
#   Phase 1 design and is out of scope to change here.
#
# WHY amd64-ONLY (deliberate, not a TODO — do not "fix" this to multi-arch)
#   The base image rocker/shiny-verse publishes an amd64 manifest ONLY; there
#   is no arm64 base to build FROM (verified against Docker Hub 2026-08-30).
#   arm64 exists further down the rocker stack (r-ver, tidyverse) but disappears
#   once shiny-server is layered on, so a linux/arm64 build would fail instantly
#   with "no match for platform in manifest". Hence: no QEMU, no platforms list,
#   no manifest merging. Apple-Silicon users run the amd64 image under emulation
#   (see README "Image Notes").
# ---------------------------------------------------------------------------
name: Docker

# WHY THESE TRIGGERS
#   pull_request -> main : the build + smoke-test gate. Never pushes.
#   push -> main         : builds, smoke-tests, then PUBLISHES
#                          ghcr.io/amc-heme/celldiver:latest + a sha- tag. This
#                          build also keeps the default-branch GHA layer cache
#                          warm. That cache is branch-scoped: a PR branch can
#                          restore cache written by its BASE branch (main) but
#                          not cache from other PR branches. Without a build on
#                          main there is no cache for PRs to restore, so every
#                          PR would pay a full ~30-45 min cold build.
#   push -> v* tags      : publishes the semver release images (v1.2.3 ->
#                          1.2.3 / 1.2 / 1). Additive and safe: pre-existing v*
#                          tags do NOT fire retroactively — only tags pushed
#                          after this trigger lands will publish.
#   workflow_dispatch    : lets us run the build manually while iterating.
# No `paths:` filter on purpose: every PR should pass the gate. With a warm
# cache an unchanged Dockerfile is a fast cache-hit rebuild, so gating every PR
# is cheap.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Publish release images on version tags. Additive: existing v* tags do
    # not fire retroactively, only tags pushed after this lands.
    tags: ['v*']
  workflow_dispatch:

# Workflow-level default: least privilege (checkout only). The GHA cache
# authenticates with the Actions runtime token, not GITHUB_TOKEN, so the build
# needs no extra scope. The build JOB widens this to `packages: write` at the
# job level (below) so ONLY that job can publish to GHCR — and PR runs still
# push nothing because the login/push steps are gated off pull_request.
permissions:
  contents: read

# Cancel a stale in-progress build when a newer commit lands on the same ref, so
# a rapid series of PR pushes doesn't queue redundant ~30 min builds. Keyed on
# workflow + ref so main's publish build and PR builds never cancel each other
# (different refs => different concurrency groups).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold build of this full Seurat/Bioconductor tree is ~30-45 min. Cap the
    # job so a hung build fails cleanly instead of burning the 6-hour default.
    timeout-minutes: 120
    # Grant packages: write ONLY on this job (least privilege) so the login +
    # push steps can create/update the GHCR package via the repo's
    # GITHUB_TOKEN. contents: read is still needed for actions/checkout.
    permissions:
      contents: read
      packages: write
    steps:
      # Checkout provides the Dockerfile, shiny-server.conf and docker/ build
      # context. (It does NOT provide the R sources the image runs — those are
      # installed from GitHub main inside the Dockerfile; see the limitation
      # note at the top of this file.)
      - name: Check out repository
        uses: actions/checkout@v7

      # ubuntu-latest ships with only ~14 GB free, but this image (full Seurat +
      # Bioconductor) plus the mode=max cache export and `load: true` need far
      # more. Reclaim ~25 GB by deleting preinstalled toolchains we never use.
      # "no space left on device" mid apt-get / install.packages is the single
      # most likely CI failure here, so free space BEFORE building.
      - name: Free up runner disk space
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/.ghcup /usr/share/swift
          echo "Disk after cleanup:"
          df -h /

      # setup-buildx-action switches to the docker-container build driver, which
      # is what makes `cache-from/to type=gha` and `load: true` available — the
      # default docker driver supports neither.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticate to GHCR so the push step can publish. Gated OFF pull
      # requests so a PR never even attempts a registry login — that keeps the
      # PR path provably push-free. github.actor + the repo's GITHUB_TOKEN act
      # on behalf of the repository (no personal PAT), which is what lets the
      # workflow create the org-owned package on the first main build.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute the image tags + OCI labels consumed by the push step. This runs
      # on EVERY event, PRs included: it only computes strings and has NO
      # registry side effects, so leaving it ungated is safe. Running it on PRs
      # is deliberate — a reviewer can read steps.meta.outputs.tags out of the
      # PR run log to confirm the tag logic (no `latest` off the default branch,
      # correct sha- format) without anything being pushed.
      #
      # The image name is HARD-CODED lowercase on purpose. GHCR rejects
      # uppercase image names, and this repo is "amc-heme/cellDIVER" (capital
      # D-I-V-E-R); interpolating ${{ github.repository }} would emit an invalid
      # uppercase reference. Hardcoding the lowercase name sidesteps that.
      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/amc-heme/celldiver
          # latest=false disables the action's default "auto latest on a semver
          # tag" behavior, so `latest` is controlled explicitly below. We want
          # latest to track main, NOT the newest release tag.
          flavor: |
            latest=false
          tags: |
            # `latest` only on the default branch (main); never on tags or PRs.
            type=raw,value=latest,enable={{is_default_branch}}
            # Semver tags fire only on v* git tags: v1.2.3 -> 1.2.3, 1.2, 1.
            # (Pre-releases like v1.2.3-rc1 only extend {{version}}, so they
            # never move the shared 1.2 / 1 tags.)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Short commit SHA (sha-<7 hex>) on every build for exact
            # provenance, independent of branch or tag.
            type=sha

      # KNOWN TRANSIENT (not a Dockerfile bug): the image installs cellDIVER via
      # the GitHub API (BiocManager -> remotes::install_github), which is rate
      # limited to 60 req/hr for UNAUTHENTICATED callers. GitHub-hosted runners
      # share outbound IPs, so several builds at once (a push-to-main build
      # racing a PR build, or approving multiple queued runs together) can hit a
      # transient "HTTP error 403" on this install step. Fix: just re-run the
      # job. If it recurs often, pass GITHUB_TOKEN into the build as a secret to
      # lift the limit -- kept out for now to stay tokenless.
      #
      # This step ALWAYS builds with push: false + load: true so the smoke test
      # can `docker run` the exact image. Publishing is a SEPARATE step that
      # runs AFTER the smoke test (see "Push image to GHCR" below), so a broken
      # image can never reach the registry.
      - name: Build image (linux/amd64, load for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          # Single-arch by design; see "WHY amd64-ONLY" at the top of the file.
          platforms: linux/amd64
          # Never push here. The publish step below pushes only after the smoke
          # test passes.
          push: false
          # Load the built image into the local Docker daemon so the smoke test
          # below can `docker run` it. `load: true` requires a single-platform
          # build (incompatible with multi-arch) — consistent with amd64-only.
          load: true
          # Local-only tag for the smoke test; NOT a registry reference. The
          # publish step uses the docker/metadata-action tags instead.
          tags: celldiver:ci
          # The docker exporter used by `load: true` cannot carry provenance
          # attestations; disabling them avoids a "manifest list" export error
          # and keeps the loaded image a plain single-platform image.
          provenance: false
          # GHA layer cache. mode=max caches EVERY intermediate layer (not just
          # the final image), which is what makes a warm rebuild of this deep R
          # dependency tree fast. NOTE: GHA cache is ~10 GB per repo and this
          # tree is large; if you observe cache thrashing (repeated ~40 min
          # builds with no cache hits) the export is evicted — fall back to
          # `cache-to: type=gha,mode=min` here and note why.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start the freshly built image. shiny-server binds :3838 immediately for
      # the directory indexes, but each Shiny app boots LAZILY on first request
      # (loading Seurat + the demo object), which is why the app routes get
      # a generous retry budget rather than a fixed sleep.
      - name: Start container
        run: |
          docker run -d --name celldiver_smoke -p 3838:3838 celldiver:ci
          docker ps

      # Poll every served route until it returns HTTP 2xx. --retry-all-errors +
      # 30 x 5 s covers both the brief connection-refused window before
      # shiny-server binds and the couple of minutes an app needs to boot on
      # first hit. NOTE the layout is /demo/browser + /demo/config, NOT /demo.
      # CAVEAT: shiny-server can serve an HTML *error* page with a 200 status
      # when an app fails to start, so a passing curl here is necessary but NOT
      # sufficient — the log check in the next step is the real health gate.
      - name: Smoke test served routes
        run: |
          set -euo pipefail
          for route in / /demo/ /demo/browser/ /demo/config/; do
            echo "== GET http://localhost:3838${route} =="
            curl --fail -sS --retry 30 --retry-delay 5 --retry-all-errors \
              -o /dev/null "http://localhost:3838${route}"
            echo "  -> 2xx OK"
          done

      # THE REAL HEALTH GATE. App-level startup errors are written to
      # /var/log/shiny-server/ INSIDE the container and never appear in
      # `docker logs`. A healthy app prints a "Listening on" line once its R
      # process is up (before it serves any request), so requiring both the
      # browser and config apps to have logged it rules out the 200-error-page
      # trap noted above. shiny-server names each log "<app-dir>-shiny-<ts>-
      # <port>.log", i.e. browser-*.log and config-*.log for the two demo apps.
      - name: Verify both apps started cleanly
        run: |
          set -euo pipefail
          for app in browser config; do
            # Match this app's shiny-server log(s) for the "Listening on" line.
            if docker exec celldiver_smoke \
                sh -c "grep -lq 'Listening on' \
                  /var/log/shiny-server/${app}-*.log 2>/dev/null"; then
              echo "OK: '${app}' app logged 'Listening on'"
            else
              echo "FAIL: '${app}' app never logged 'Listening on'" >&2
              exit 1
            fi
          done

      # Publish the validated image to GHCR. This is the ONLY step that writes
      # to a registry, and it is gated OFF pull requests, so the PR path
      # provably pushes nothing. GitHub applies an implicit success() to any
      # `if:` that lacks a status function, so this step ALSO runs only when
      # every smoke-test step above passed — i.e. a broken image never reaches
      # the registry (which matters: the person running this cannot delete
      # package versions, so a bad publish could not be cleaned up).
      #
      # WHY a second build-push-action rather than pushing from the build step:
      # buildx cannot both `load` (docker exporter, needed for the smoke test)
      # and `push` (registry exporter) in one step. By the time we reach here
      # every layer is in the buildx cache, so this "rebuild" is just cache hits
      # plus the registry upload — cheap. It reuses the metadata-action
      # tags/labels; provenance: false keeps the package listing free of extra
      # attestation manifests.
      - name: Push image to GHCR (after smoke test passes)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          # Single-arch by design; see "WHY amd64-ONLY" at the top of the file.
          platforms: linux/amd64
          push: true
          # Registry tags + OCI labels computed by docker/metadata-action above.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # Reuse the warm cache the build step just wrote; no cache-to needed
          # (the build step already exported mode=max).
          cache-from: type=gha

      # Always dump BOTH log sources so any failure above is debuggable. `docker
      # logs` shows shiny-server's own stdout; the per-app logs under
      # /var/log/shiny-server/ hold the R startup errors that never reach
      # `docker logs`. Without this step you would be debugging blind.
      - name: Dump shiny-server logs
        if: always()
        run: |
          echo "===== docker logs celldiver_smoke ====="
          docker logs celldiver_smoke || true
          echo "===== /var/log/shiny-server/*.log (inside container) ====="
          docker exec celldiver_smoke \
            sh -c 'cat /var/log/shiny-server/*.log' || true
