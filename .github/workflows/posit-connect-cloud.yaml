# ---------------------------------------------------------------------------
# Deploy cellDIVER to Posit Connect Cloud.
#
# WHAT THIS DOES
#   On manual dispatch only, this stages the bundled demo dataset alongside the
#   existing demo browser app (docker/shiny-server/demo/browser/app.R — the
#   same app.R shiny-server serves in the Docker image) and publishes that
#   directory to Posit Connect Cloud using rsconnect's push-based deploy.
#   rsconnect records cellDIVER plus its full dependency tree — CRAN,
#   Bioconductor, and the GitHub Remotes SCUBA/scDE — in the generated
#   manifest, and Connect Cloud reinstalls them to run the app.
#
# WHY workflow_dispatch ONLY (per issue #429)
#   Publishing is a deliberate, credentialed action against a shared public
#   endpoint, so it is never triggered automatically by push or pull_request —
#   an operator starts it by hand from the Actions tab.
#
# CREDENTIALS (repository secrets, all prefixed POSIT_CLOUD_)
#   POSIT_CLOUD_CLIENT_ID      OAuth client id for a Connect Cloud service account
#   POSIT_CLOUD_CLIENT_SECRET  OAuth client secret paired with POSIT_CLOUD_CLIENT_ID
#   POSIT_CLOUD_ACCOUNT        Connect Cloud account name to publish to
#   These feed rsconnect::connectCloudClientCredentials() (added in rsconnect
#   1.10.0), the non-interactive auth path documented at
#   https://docs.posit.co/connect-cloud/user/publish/console-or-terminal.html
# ---------------------------------------------------------------------------
name: Posit Connect Cloud

# Manual only — see "WHY workflow_dispatch ONLY" above.
on:
  workflow_dispatch:

# Least privilege: the job only reads the repo to build the bundle. Publishing
# authenticates with the POSIT_* secrets, not the GITHUB_TOKEN, so no write
# scope is needed.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Building the reusable CI image once is still heavy, but later runs reuse
    # the cached dependency layers instead of reinstalling everything in the job.
    timeout-minutes: 120
    env:
      # Lift GitHub's 60 req/hr unauthenticated API limit so BiocManager/remotes
      # can resolve the exact GitHub commit we install for deployment.
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/.ghcup /usr/share/swift
          echo "Disk after cleanup:"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build reusable CI base image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ci-base
          load: true
          tags: celldiver-ci-base:deploy
          provenance: false
          cache-from: type=gha,scope=celldiver-dockerfile
          cache-to: type=gha,mode=max,scope=celldiver-dockerfile

      # Install the exact checked-out commit from GitHub into the cached CI base
      # so rsconnect records a GitHub remote source Connect Cloud can reinstall.
      - name: Deploy to Posit Connect Cloud
        env:
          POSIT_CLIENT_ID: ${{ secrets.POSIT_CLOUD_CLIENT_ID }}
          POSIT_CLIENT_SECRET: ${{ secrets.POSIT_CLOUD_CLIENT_SECRET }}
          POSIT_ACCOUNT: ${{ secrets.POSIT_CLOUD_ACCOUNT }}
          CELLDIVER_GITHUB_SHA: ${{ github.sha }}
        run: |
          docker run --rm \
            -e GITHUB_PAT \
            -e POSIT_CLIENT_ID \
            -e POSIT_CLIENT_SECRET \
            -e POSIT_ACCOUNT \
            -e CELLDIVER_GITHUB_SHA \
            -v "$PWD":/work \
            -w /work \
            celldiver-ci-base:deploy \
            bash -s <<'EOF'
          set -euo pipefail
          Rscript - <<'RS'
          client_id <- trimws(Sys.getenv("POSIT_CLIENT_ID"))
          client_secret <- trimws(Sys.getenv("POSIT_CLIENT_SECRET"))
          account <- trimws(Sys.getenv("POSIT_ACCOUNT"))

          missing <- c(
            POSIT_CLOUD_CLIENT_ID = nzchar(client_id),
            POSIT_CLOUD_CLIENT_SECRET = nzchar(client_secret),
            POSIT_CLOUD_ACCOUNT = nzchar(account)
          )
          if (!all(missing)) {
            stop(
              "Missing required repository secret(s): ",
              paste(names(missing)[!missing], collapse = ", "),
              call. = FALSE
            )
          }

          if (packageVersion("rsconnect") < "1.10.0") {
            stop(
              "rsconnect >= 1.10.0 is required for ",
              "connectCloudClientCredentials(); got ",
              as.character(packageVersion("rsconnect"))
            )
          }

          options(timeout = 600)
          remotes::install_github(
            sprintf(
              "amc-heme/cellDIVER@%s",
              Sys.getenv("CELLDIVER_GITHUB_SHA")
            ),
            dependencies = FALSE,
            upgrade = "never"
          )
          if (!requireNamespace("cellDIVER", quietly = TRUE)) {
            stop("cellDIVER failed to install")
          }

          demo_dir <- "docker/shiny-server/demo/browser"
          if (!file.copy(
            system.file(
              "extdata", "test_dataset.rds",
              package = "cellDIVER", mustWork = TRUE
            ),
            file.path(demo_dir, "object.rds"),
            overwrite = TRUE
          )) {
            stop("Failed to stage object.rds")
          }
          if (!file.copy(
            system.file(
              "extdata", "test_dataset_config.yaml",
              package = "cellDIVER", mustWork = TRUE
            ),
            file.path(demo_dir, "object-config.yaml"),
            overwrite = TRUE
          )) {
            stop("Failed to stage object-config.yaml")
          }

          rsconnect::connectCloudClientCredentials(
            clientId = client_id,
            clientSecret = client_secret,
            accountName = account
          )
          rsconnect::deployApp(
            appDir = "docker/shiny-server/demo/browser",
            appName = "cellDIVER",
            appTitle = "cellDIVER",
            account = account,
            server = "connect.posit.cloud",
            forceUpdate = TRUE,
            launch.browser = FALSE,
            logLevel = "verbose"
          )
          RS
          EOF
